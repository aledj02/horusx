name: release-alpha
on:
  push:
    branches:
      - main
permissions: read-all
jobs:
  ReleaseAlpha:
    permissions:
      contents: write
      packages: write
      issues:   write
    runs-on: ubuntu-latest
    env:
      COSIGN_KEY_LOCATION: /tmp/cosign.key
      COSIGN_PWD: ${{ secrets.COSIGN_PWD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.17

      - name: Docker Login
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Cosign Installer
        uses: sigstore/cosign-installer@main
        with:
          cosign-release: 'v1.2.0'

      - name: Install Mage
        run: go install github.com/magefile/mage@v1.11

      - name: Get current date
        id: date
        run: mage -v getCurrentDate

      - name: Git config
        run: mage -v defaultGitConfig

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v4
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Install cosign private key
        run: mage -v writeCosignKeyToFile
        env:
          COSIGN_KEY: ${{secrets.COSIGN_KEY}}

      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          push: true
          context: .
          file: ./deployments/Dockerfile
          tags: horuszup/horusx-cli:alpha
          platforms: linux/amd64,linux/arm64

      - name: Sign image
        run: |
          cosign sign -key $COSIGN_KEY_LOCATION horuszup/horusx-cli:alpha
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PWD }}

      - name: Create local tag
        run: mage -v createAlphaTag

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v2
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --skip-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PWD: ${{ secrets.COSIGN_PWD }}
          GORELEASER_CURRENT_TAG: v0.0.0-alpha
          CURRENT_DATE: ${{ steps.date.outputs.date }}
          CLI_VERSION: alpha

      - name: Delete outdate release
        uses: dev-drprasad/delete-tag-and-release@v0.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          delete_release: true
          tag_name: alpha

      - name: Update alpha release
        uses: softprops/action-gh-release@v1
        with:
          name: alpha
          tag_name: alpha
          prerelease: true
          draft: false
          target_commitish: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## Description

            This tag it's updated every time there's a change in the main branch. It's a developement tag and should not be used in production.

            ## Docker images

            - `docker pull horuszup/horusx-cli:alpha`
          files: |
            ./dist/checksums.txt
            ./dist/checksums.txt.sig
            ./deployments/cosign.pub
            ./dist/horusx_linux_amd64/horusx_linux_amd64
            ./dist/horusx_linux_amd64/horusx_linux_amd64.sig
            ./dist/horusx_linux_386/horusx_linux_x86
            ./dist/horusx_linux_386/horusx_linux_x86.sig
            ./dist/horusx_darwin_amd64/horusx_mac_amd64
            ./dist/horusx_darwin_amd64/horusx_mac_amd64.sig
            ./dist/horusx_windows_amd64/horusx_win_amd64.exe
            ./dist/horusx_windows_amd64/horusx_win_amd64.exe.sig
            ./dist/horusx_windows_386/horusx_win_x86.exe
            ./dist/horusx_windows_386/horusx_win_x86.exe.sig
            ./dist/horusx_linux_arm64/horusx_linux_arm64
            ./dist/horusx_linux_arm64/horusx_linux_arm64.sig
            ./dist/horusx_windows_arm64/horusx_win_arm64.exe
            ./dist/horusx_windows_arm64/horusx_win_arm64.exe.sig
            ./dist/horusx_darwin_arm64/horusx_mac_arm64
            ./dist/horusx_darwin_arm64/horusx_mac_arm64.sig
            ./dist/horusx-standalone_linux_amd64/horusx_linux_amd64_stand_alone
            ./dist/horusx-standalone_linux_amd64/horusx_linux_amd64_stand_alone.sig
            ./dist/horusx-standalone_linux_386/horusx_linux_x86_stand_alone
            ./dist/horusx-standalone_linux_386/horusx_linux_x86_stand_alone.sig
            ./dist/horusx-standalone_darwin_amd64/horusx_mac_amd64_stand_alone
            ./dist/horusx-standalone_darwin_amd64/horusx_mac_amd64_stand_alone.sig
            ./dist/horusx-standalone_windows_amd64/horusx_win_amd64_stand_alone.exe
            ./dist/horusx-standalone_windows_amd64/horusx_win_amd64_stand_alone.exe.sig
            ./dist/horusx-standalone_windows_386/horusx_win_x86_stand_alone.exe
            ./dist/horusx-standalone_windows_386/horusx_win_x86_stand_alone.exe.sig
            ./dist/horusx-standalone_linux_arm64/horusx_linux_arm64_stand_alone
            ./dist/horusx-standalone_linux_arm64/horusx_linux_arm64_stand_alone.sig
            ./dist/horusx-standalone_windows_arm64/horusx_win_arm64_stand_alone.exe
            ./dist/horusx-standalone_windows_arm64/horusx_win_arm64_stand_alone.exe.sig
            ./dist/horusx-standalone_darwin_arm64/horusx_mac_arm64_stand_alone
            ./dist/horusx-standalone_darwin_arm64/horusx_mac_arm64_stand_alone.sig

      - name: Push updates
        run: mage -v gitPushAlpha
